# Custom overrides for Game Server
database.password = 123456

# ================================================================
# Chat Server Integration
# ================================================================
gameserver.chatserver.enable = true

# Preserve normal combat when the solo player's account has GM command access
gameserver.administration.login.execute_commands =
# Minimum access level: 0 enables these flight options for all players.
gameserver.administration.flight.free_fly = 0
gameserver.administration.flight.unlimited_time = 0
gameserver.administration.auto_res = 10
gameserver.administration.instance.enter_all = 10

# ================================================================
# Solo RPG Experience Configuration
# ================================================================

# Solo Instances & Free Entrance (0 = membership requirement 0, i.e. unlocked for everyone)
gameserver.instances.group.requirement = 0
gameserver.instances.quest.requirement = 0
gameserver.instances.cooldown = 0
gameserver.instance.cooldown_rate = 0

# Instance Monster/Boss Scaling for Solo Play
gameserver.instance.scaling.enable = true
gameserver.instance.scaling.max_level_diff = 65
gameserver.instance.scaling.hp_scale_factor = 0.65
gameserver.instance.scaling.hp_floor = 0.35
gameserver.instance.scaling.dmg_scale_factor = 0.5
gameserver.instance.scaling.dmg_floor = 0.5

# Solo economy: remove the daily NPC sell limit
gameserver.limits.enable = false

# Quality of Life
gameserver.quest.stigma.slot = 0
gameserver.simple.secondclass.enable = false
gameserver.poeta.journey.enable = true
gameserver.base.flytime = 300
gameserver.soulsickness.disable = 0
gameserver.skill.chain.disable_triggerrate = true
